<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W47 · variant 4</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- harness: not part of the widget, stripped at assembly ---------------- */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); display: flex; justify-content: center; }
.harness { width: 100%; max-width: 430px; }
.harness__label, .harness__note { font-size: var(--micro); line-height: var(--micro-lh); font-weight: 600; text-transform: uppercase; letter-spacing: var(--micro-tracking); color: var(--ink-3); margin: 0; padding: var(--space-3) var(--space-4); }
.harness__note { color: var(--gold-text); min-height: 38px; }
.harness__bar { display: flex; justify-content: space-between; gap: var(--space-3); padding: 0 var(--space-4) var(--space-6); }
.harness__bar a, .harness__bar button { font: inherit; font-size: var(--body-sm); font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-pill); min-height: 44px; padding: 0 var(--space-4); display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
/* ---- the widget ---------------------------------------------------------- */

[data-component="W47"] {
  --glass:      color-mix(in srgb, var(--surface) 62%, transparent);
  --glass-2:    color-mix(in srgb, var(--surface) 44%, transparent);
  --glass-edge: color-mix(in srgb, var(--ink) 18%, transparent);
  --glass-hi:   color-mix(in srgb, var(--ink) 30%, transparent);
  --glass-blur: blur(22px) saturate(140%);
  position: relative; width: 100%; min-height: 780px; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--body); line-height: var(--body-lh);
  display: flex; flex-direction: column;
}
[data-component="W47"] * { box-sizing: border-box; }
[data-component="W47"] h1 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
[data-component="W47"] h1 em { font-style: normal; color: var(--gold-text); }
[data-component="W47"] p { margin: 0; }
[data-component="W47"] .wm { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }
[data-component="W47"] .wm b { font-family: var(--font-ui); font-weight: 700; color: var(--gold-text); letter-spacing: .02em; }
[data-component="W47"] .micro { font-size: var(--micro); line-height: var(--micro-lh); font-weight: 600; text-transform: uppercase; letter-spacing: var(--micro-tracking); }
/* Language pill: one pill, two halves (ux-context rule 6) */
[data-component="W47"] .lang { display: inline-flex; border: 1px solid var(--glass-edge); border-radius: var(--r-pill); padding: 2px; background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
[data-component="W47"] .lang button { color: var(--ink); }
[data-component="W47"] .lang button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: var(--caption); font-weight: 600; min-width: 48px; min-height: 36px; border-radius: var(--r-pill); cursor: pointer; }
[data-component="W47"] .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
[data-component="W47"] .btn { appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: var(--heading); border-radius: var(--r-pill); border: 0; min-height: 52px; padding: 0 var(--space-6); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: transform var(--t-state) ease-out, background var(--t-state) ease-out; }
[data-component="W47"] .btn:active { transform: scale(.98); }
[data-component="W47"] .btn:focus-visible, [data-component="W47"] button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[data-component="W47"] .btn--primary { background: var(--gold); color: var(--ink-on-gold); }
[data-component="W47"] .opt { appearance: none; cursor: pointer; font: inherit; font-weight: 500; color: var(--ink); text-align: left; min-height: 48px; padding: var(--space-3) var(--space-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); transition: background var(--t-state) ease-out, border-color var(--t-state) ease-out; }
[data-component="W47"] .opt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-wash); font-weight: 600; }
[data-component="W47"] .opt[aria-pressed="true"]::after { content: " ✓"; color: var(--gold-text); }
[data-component="W47"] .facts { display: flex; flex-wrap: wrap; gap: var(--space-2); list-style: none; padding: 0; margin: 0; }
[data-component="W47"] .facts li { font-size: var(--body-sm); font-weight: 600; padding: var(--space-1) var(--space-3); border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--ink); }
/* Glass: a translucent, blurred panel with a fine edge. No shadow (tokens.css). */
[data-component="W47"] .glass { background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-edge); border-top-color: var(--glass-hi); }
[data-component="W47"] .btn--glass { background: var(--glass-2); color: var(--ink); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-edge); border-top-color: var(--glass-hi); }
[data-component="W47"] .btn--glass-gold { background: color-mix(in srgb, var(--gold) 82%, transparent); color: var(--ink-on-gold); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid color-mix(in srgb, var(--gold) 60%, var(--ink)); }
/* Entrance: one soft rise, staggered. Old phones: transform + opacity only. */
[data-component="W47"] .rise { opacity: 0; transform: translateY(12px); animation: w36rise var(--t-enter) var(--ease) forwards; }
[data-component="W47"] .d1 { animation-delay: 80ms; } [data-component="W47"] .d2 { animation-delay: 160ms; }
[data-component="W47"] .d3 { animation-delay: 240ms; } [data-component="W47"] .d4 { animation-delay: 320ms; }
[data-component="W47"] .d5 { animation-delay: 400ms; }
@keyframes w36rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-component="W47"] .rise { animation: none; opacity: 1; transform: none; } }

/* Words arrive one by one: out of focus, then sharp (the "scan" feeling). */
[data-component="W47"] .w { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(10px);
  animation: w36word 560ms var(--ease) forwards; animation-delay: calc(var(--base, 0ms) + var(--i) * 70ms); }
@keyframes w36word { to { opacity: 1; filter: none; transform: none; } }
/* Things that float: a slow, small bob so the screen breathes. */
[data-component="W47"] .float { animation: w36float 6s ease-in-out infinite; }
@keyframes w36float { 50% { transform: translateY(-6px); } }
/* The photo drifts slowly behind everything. */
[data-component="W47"] .drift { animation: w36drift 24s ease-in-out infinite alternate; }
@keyframes w36drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -2%); } }
/* A light passes over the main button every few seconds. */
[data-component="W47"] .sheen { position: relative; overflow: hidden; isolation: isolate; }
[data-component="W47"] .sheen::after { content: ""; position: absolute; inset: -20% auto -20% -40%; width: 30%; z-index: -1;
  background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--ink-on-gold) 0%, rgba(255,255,255,.45)), transparent);
  transform: skewX(-18deg); animation: w36sheen 4.5s var(--ease) infinite 1.6s; }
@keyframes w36sheen { 0% { left: -40%; } 35%, 100% { left: 130%; } }
/* Staggered entrance for blocks, driven by --i so the order is the Z order. */
[data-component="W47"] .pop { opacity: 0; transform: translateY(14px) scale(.98); animation: w36pop 480ms var(--ease) forwards;
  animation-delay: calc(var(--base, 0ms) + var(--i, 0) * 90ms); }
@keyframes w36pop { to { opacity: 1; transform: none; } }
[data-component="W47"] .beat[hidden] { display: none; }
[data-component="W47"] .back { appearance: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); font-size: 20px; }
[data-component="W47"] .dots { display: flex; gap: var(--space-1); }
[data-component="W47"] .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line-strong); transition: background var(--t-progress) var(--ease); }
[data-component="W47"] .dots i.on { background: var(--gold); }
[data-component="W47"] .quote { font-family: var(--font-display); font-weight: 600; font-size: var(--title-2); line-height: var(--title-2-lh); color: var(--gold-text); }
[data-component="W47"] .q2 { font-size: var(--body-sm); line-height: var(--body-sm-lh); color: var(--ink-2); }
[data-component="W47"] .promise { color: var(--ink-2); }
[data-component="W47"] .qtitle { font-family: var(--font-display); font-weight: 600; font-size: var(--display-2); line-height: var(--display-2-lh); margin: 0; }
[data-component="W47"] .opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tile-gap); }
[data-component="W47"] .opts .opt { min-height: 104px; border-radius: var(--r-lg); background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-color: var(--glass-edge); border-top-color: var(--glass-hi); font-size: var(--heading); font-weight: 600; display: flex; align-items: flex-end; }
[data-component="W47"] .opts .opt[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold-wash) 82%, transparent); }
@media (prefers-reduced-motion: reduce) {
  [data-component="W47"] .w, [data-component="W47"] .pop { animation: none; opacity: 1; filter: none; transform: none; }
  [data-component="W47"] .float, [data-component="W47"] .drift, [data-component="W47"] .sheen::after { animation: none; }
}


[data-component="W47"] { min-height: 100dvh; padding: var(--space-4); gap: var(--space-4); }
[data-component="W47"] .top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
[data-component="W47"] .right { display: flex; align-items: center; gap: var(--space-2); }
[data-component="W47"] h1 { font-size: var(--display-2); line-height: var(--display-2-lh); }
[data-component="W47"] .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--gold-text); flex: none; }
[data-component="W47"] .btn--line { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); min-height: 48px; font-size: var(--body); }
[data-component="W47"] .nophoto { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--r-lg); border: 1px dashed var(--line-strong); }
[data-component="W47"] .np-t { font-weight: 600; } [data-component="W47"] .np-l { color: var(--ink-2); font-size: var(--body-sm); line-height: var(--body-sm-lh); }
[data-component="W47"] .end { display: flex; flex-direction: column; gap: var(--space-2); margin-top: auto; }
[data-component="W47"] .end[hidden] { display: none; }
[data-component="W47"] .sign { text-align: center; font-size: var(--caption); color: var(--ink-2); }
[data-component="W47"] .mail { font-size: var(--caption); color: var(--ink-2); text-align: center; user-select: all; -webkit-user-select: all; }

[data-component="W47"] .thread { display: flex; flex-direction: column; gap: var(--space-3); flex: 1; }
[data-component="W47"] .msg { display: flex; gap: var(--space-3); align-items: flex-end; animation: w41in 380ms var(--ease); }
@keyframes w41in { from { opacity: 0; transform: translateY(10px); } }

[data-component="W47"] .av.ghost { visibility: hidden; }
[data-component="W47"] .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg) var(--r-lg) var(--r-lg) var(--r-sm); padding: var(--space-3) var(--space-4); max-width: 84%; }
[data-component="W47"] .bubble .micro { color: var(--gold-text); }
[data-component="W47"] .bubble.big .txt { font-family: var(--font-display); font-weight: 600; font-size: var(--title-1); line-height: var(--title-1-lh); }
[data-component="W47"] .bubble em { font-style: normal; color: var(--gold-text); }
[data-component="W47"] .bubble.warn { border-color: var(--watch); background: var(--watch-wash); }
[data-component="W47"] .typing { display: inline-flex; gap: 5px; padding: var(--space-3) var(--space-4); }
[data-component="W47"] .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); animation: w41dot 1.1s infinite ease-in-out; }
[data-component="W47"] .typing i:nth-child(2) { animation-delay: .15s; } [data-component="W47"] .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes w41dot { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
[data-component="W47"] .answers { display: flex; flex-direction: column; gap: var(--space-2); margin-top: auto; animation: w41in 380ms var(--ease); }
[data-component="W47"] .btn--no { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); }
[data-component="W47"] .demo { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; font-size: var(--caption); color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: var(--space-3); }
[data-component="W47"] .demo button { appearance: none; font: inherit; font-size: var(--caption); font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-pill); min-height: 36px; padding: 0 var(--space-3); cursor: pointer; }
[data-component="W47"] .demo button[aria-pressed="true"] { border-color: var(--gold); }
@media (prefers-reduced-motion: reduce) { [data-component="W47"] .typing i { animation: none; opacity: .8; } }

[data-component="W47"] h1 { font-size: var(--display-2); line-height: var(--display-2-lh); }
[data-component="W47"] .foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2); }
[data-component="W47"] .sign { text-align: center; font-size: var(--caption); color: var(--ink-2); }
[data-component="W47"] .tag { display: inline-block; font-size: var(--micro); line-height: var(--micro-lh); font-weight: 600; letter-spacing: var(--micro-tracking); text-transform: uppercase; color: var(--gold-text); border: 1px solid var(--gold-dim); border-radius: var(--r-pill); padding: 2px var(--space-2); }
[data-component="W47"] .demo2 { font: inherit; font-size: var(--caption); color: var(--ink-3); background: none; border: 0; text-decoration: underline; cursor: pointer; align-self: center; min-height: 36px; }

[data-component="W47"] .live { display: flex; flex-direction: column; flex: 1; gap: var(--space-4); }
[data-component="W47"] .thread { flex: initial; }
[data-component="W47"] .answers:empty { display: none; }
[data-component="W47"] .reply { display: flex; justify-content: flex-end; animation: w41in 380ms var(--ease); }
[data-component="W47"] .reply span { display: flex; align-items: center; gap: var(--space-3); background: var(--gold-wash); border: 1px solid var(--gold-dim); border-radius: var(--r-lg) var(--r-lg) var(--r-sm) var(--r-lg); padding: var(--space-2) var(--space-4); font-weight: 600; min-height: 44px; }
[data-component="W47"] .reply i { width: 44px; height: 58px; border-radius: var(--r-md); background-size: cover; background-position: center 20%; margin-left: calc(-1 * var(--space-2)); }
[data-component="W47"] .q { font-family: var(--font-display); font-weight: 600; font-size: var(--title-1); line-height: var(--title-1-lh); }
/* Barber's choice: always last, never a card, no fill (DESIGN-SYSTEM.md 7.16). */
[data-component="W47"] .bc { appearance: none; font: inherit; color: var(--ink-2); background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; min-height: 48px; padding: var(--space-3) 0 0; display: flex; flex-direction: column; gap: 2px; }
[data-component="W47"] .bc b { font-weight: 600; color: var(--ink); font-size: var(--body); }
[data-component="W47"] .bc small { font-size: var(--caption); }
/* The card, shared by every layout: the same edge, radius and pressed state as the picture replies. */
[data-component="W47"] .wc { appearance: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; border-radius: var(--r-lg); border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3) var(--space-4); transition: border-color var(--t-state), background var(--t-state); }
[data-component="W47"] .wc b { font-size: var(--heading); line-height: 1.3; }
[data-component="W47"] .wc small { font-size: var(--body-sm); line-height: var(--body-sm-lh); color: var(--ink-2); }
[data-component="W47"] .wc[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-wash); }
[data-component="W47"] .wc[aria-pressed="true"] b { color: var(--gold-text); }

[data-component="W47"] .stack { display: flex; flex-direction: column; gap: var(--space-2); }
[data-component="W47"] .stack .wc { display: grid; grid-template-columns: 48px 1fr; column-gap: var(--space-3); align-items: center; min-height: 72px; }
[data-component="W47"] .stack .wc .g { grid-row: 1 / span 2; width: 48px; height: 48px; border-radius: var(--r-md); background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); }
[data-component="W47"] .stack .wc .g svg { width: 34px; height: 34px; }
[data-component="W47"] .stack .wc .g rect { fill: var(--line-strong); }
[data-component="W47"] .stack .wc .g rect.on { fill: var(--gold); }
[data-component="W47"] .stack .wc .g svg rect[fill], [data-component="W47"] .stack .wc .g svg line { fill: currentColor; }
[data-component="W47"] .stack .wc .g rect.keep { fill: url(#fadeg); }
[data-component="W47"] .stack .wc[aria-pressed="true"] .g { color: var(--gold-text); }


/* ---- W47 · the viewer (shared) ------------------------------------------ */
[data-component="W47"] .top { padding-bottom: var(--space-2); }
[data-component="W47"] .tw { display: flex; gap: var(--space-3); align-items: flex-end; animation: w41in 380ms var(--ease); }
[data-component="W47"] .tw .av { visibility: hidden; }
[data-component="W47"] .card { flex: 1; max-width: 84%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg) var(--r-lg) var(--r-lg) var(--r-sm); overflow: hidden; }
[data-component="W47"] .stage { position: relative; aspect-ratio: 3 / 4; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; background: var(--surface-2); }
[data-component="W47"] .stage:active { cursor: grabbing; }
[data-component="W47"] .stage:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
[data-component="W47"] .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
[data-component="W47"] .stage .v-left, [data-component="W47"] .stage .v-right { opacity: 0; }
[data-component="W47"] .stage.settle img { transition: opacity 260ms var(--ease); }
[data-component="W47"] .under { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); min-height: 48px; }
[data-component="W47"] .hint { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--body-sm); font-weight: 600; color: var(--ink); }
[data-component="W47"] .hint svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--gold-text); }
[data-component="W47"] .angle { font-size: var(--body-sm); color: var(--ink-2); }
[data-component="W47"] .ticks { display: flex; gap: var(--space-2); }
[data-component="W47"] .ticks i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink-2); transition: background var(--t-state), border-color var(--t-state); }
[data-component="W47"] .ticks i.on { background: var(--gold); border-color: var(--gold); }
[data-component="W47"] .yn { display: flex; flex-direction: column; gap: var(--space-2); }
[data-component="W47"] .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { [data-component="W47"] .stage.settle img { transition: none; } }

[data-component="W47"] .open { appearance: none; border: 0; padding: 0; margin: 0; display: block; width: 100%; background: none; cursor: pointer; position: relative; }
[data-component="W47"] .open img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
[data-component="W47"] .open .chip, [data-component="W47"] .full .chip { position: absolute; right: var(--space-3); bottom: var(--space-3); display: inline-flex; align-items: center; gap: var(--space-2); font: inherit; font-size: var(--caption); font-weight: 600; color: var(--ink); padding: var(--space-1) var(--space-3); min-height: 32px; border-radius: var(--r-pill); background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-edge); }
[data-component="W47"] .chip svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--gold-text); }
[data-component="W47"] .open:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
[data-component="W47"] .full { position: absolute; inset: 0; z-index: 5; background: var(--bg); display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); animation: w41in 300ms var(--ease); }
[data-component="W47"] .full[hidden] { display: none; }
[data-component="W47"] .full .bar { display: flex; justify-content: space-between; align-items: center; }
[data-component="W47"] .full .bar b { font-family: var(--font-display); font-weight: 600; font-size: var(--title-2); line-height: var(--title-2-lh); }
[data-component="W47"] .close { appearance: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 22px; cursor: pointer; }
[data-component="W47"] .full .stage { border-radius: var(--r-lg); }
[data-component="W47"] .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
[data-component="W47"] .thumbs button { appearance: none; padding: 0; border: 2px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; font: inherit; color: var(--ink-2); font-size: var(--caption); }
[data-component="W47"] .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: center 25%; display: block; }
[data-component="W47"] .thumbs span { padding: var(--space-1) 0; min-height: 28px; }
[data-component="W47"] .thumbs button[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); font-weight: 600; }

var SETUP = function (t, viewer) {
    var root = document.querySelector('[data-component="W47"]'), full = root.querySelector('.full'), opener = t.querySelector('.open');
    var thumbs = full.querySelectorAll('.thumbs button');
    var v = viewer(full, function (p, near) { thumbs.forEach(function (b, i) { b.setAttribute('aria-pressed', i - 1 === near ? 'true' : 'false'); }); });
    thumbs.forEach(function (b, i) { b.onclick = function () { v.settle(i - 1); }; });
    function close() { full.hidden = true; opener.focus(); }
    opener.onclick = function () { v.show(0); full.hidden = false; full.querySelector('.stage').focus(); };
    full.querySelector('.close').onclick = close;
    full.onkeydown = function (e) { if (e.key === 'Escape') close(); };
  };

(function () {
  var root = document.querySelector('[data-component="W47"]');
  var thread = root.querySelector('.thread'), timers = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NAMES = { '-1': 'Your left side', '0': 'Front', '1': 'Your right side' };
  function msg(html, big) { var m = document.createElement('div'); m.className = 'msg'; m.innerHTML = '<span class="av" aria-hidden="true"></span><div class="bubble' + (big ? ' big' : '') + '">' + html + '</div>'; thread.appendChild(m); return m; }
  function reply(t) { var d = document.createElement('div'); d.className = 'reply'; d.innerHTML = '<span>' + t + '</span>'; thread.appendChild(d); }
  function answers(html) { var a = root.querySelector('.answers'); if (a) a.remove(); if (!html) return null; a = document.createElement('div'); a.className = 'answers'; a.innerHTML = html; root.querySelector('.live').appendChild(a); return a; }

  // One viewer. p runs from -1 (left side) through 0 (front) to 1 (right side).
  function viewer(el, onChange) {
    var st = el.querySelector('.stage'), L = st.querySelector('.v-left'), R = st.querySelector('.v-right');
    var p = 0, start = null, turned = false;
    function show(v) {
      p = Math.max(-1, Math.min(1, v));
      // The blend happens only in the middle of the move: most of the way the
      // finger holds a real picture, so the double image is seen only briefly.
      function ease(x) { x = Math.max(0, Math.min(1, (x - .3) / .4)); return x * x * (3 - 2 * x); }
      L.style.opacity = ease(-p); R.style.opacity = ease(p);
      var near = Math.round(p);
      st.setAttribute('aria-valuenow', near); st.setAttribute('aria-valuetext', NAMES[near]);
      onChange && onChange(p, near, turned);
    }
    function settle(to) { st.classList.add('settle'); show(to); setTimeout(function () { st.classList.remove('settle'); }, 280); }
    st.addEventListener('pointerdown', function (e) { start = { x: e.clientX, y: e.clientY, p: p, id: e.pointerId, live: false }; });
    st.addEventListener('pointermove', function (e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!start.live) { if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return; start.live = true; st.setPointerCapture(e.pointerId); }
      turned = true; show(start.p + dx / (st.clientWidth * 0.55));
    });
    function up() { if (!start) return; var was = start.live; start = null; if (was) settle(Math.round(p)); }
    st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
    st.addEventListener('keydown', function (e) {
      var k = e.key; if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'Home' && k !== 'End') return;
      e.preventDefault(); turned = true;
      settle(k === 'Home' ? -1 : k === 'End' ? 1 : Math.round(p) + (k === 'ArrowRight' ? 1 : -1));
    });
    return { show: show, settle: settle, get p() { return p; }, get turned() { return turned; }, stage: st };
  }

  function run() {
    timers.forEach(clearTimeout); timers = []; thread.innerHTML = ''; answers('');
    msg('<p>Here’s your AI twin, in good light.</p>');
    timers.push(setTimeout(function () {
      var t = document.createElement('div'); t.className = 'tw';
      t.innerHTML = '<span class="av" aria-hidden="true"></span>' + TWIN;
      thread.appendChild(t);
      SETUP(t, viewer);
    }, 700));
    timers.push(setTimeout(function () {
      msg('<p class="txt">AI can make mistakes. Does this look like you?</p>', true);
      var a = answers('<div class="yn"><button type="button" class="btn btn--glass-gold" data-a="yes">Yes, that’s me</button><button type="button" class="btn btn--no" data-a="no">Not quite</button></div>');
      a.querySelectorAll('[data-a]').forEach(function (b) { b.addEventListener('click', function () {
        answers(''); reply(b.dataset.a === 'yes' ? 'Yes, that’s me' : 'Not quite');
        timers.push(setTimeout(function () { msg(b.dataset.a === 'yes' ? '<p>Great. Now we draw your new cut on it.</p>' : '<p>Thanks for saying. In the app, another one is made now.</p>'); }, 400));
      }); });
    }, 1900));
  }
  root.querySelector('[data-again]').addEventListener('click', run);
  run();
})();

document.getElementById('theme-flip').addEventListener('click', function () {
  var el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
document.addEventListener('keydown', function (e) {
  if (e.key.toLowerCase() !== 't' || e.target.closest('[role=slider]')) return;
  var el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
