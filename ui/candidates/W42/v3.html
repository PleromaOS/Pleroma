<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W42 · variant 3</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---- harness: not part of the widget, stripped at assembly ---------------- */
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); display: flex; justify-content: center; }
.harness { width: 100%; max-width: 430px; }
.harness__label, .harness__note { font-size: var(--micro); line-height: var(--micro-lh); font-weight: 600; text-transform: uppercase; letter-spacing: var(--micro-tracking); color: var(--ink-3); margin: 0; padding: var(--space-3) var(--space-4); }
.harness__note { color: var(--gold-text); min-height: 38px; }
.harness__bar { display: flex; justify-content: space-between; gap: var(--space-3); padding: 0 var(--space-4) var(--space-6); }
.harness__bar a, .harness__bar button { font: inherit; font-size: var(--body-sm); font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-pill); min-height: 44px; padding: 0 var(--space-4); display: inline-flex; align-items: center; text-decoration: none; cursor: pointer; }
/* ---- the widget ---------------------------------------------------------- */

[data-component="W42"] {
  --glass:      color-mix(in srgb, var(--surface) 62%, transparent);
  --glass-2:    color-mix(in srgb, var(--surface) 44%, transparent);
  --glass-edge: color-mix(in srgb, var(--ink) 18%, transparent);
  --glass-hi:   color-mix(in srgb, var(--ink) 30%, transparent);
  --glass-blur: blur(22px) saturate(140%);
  position: relative; width: 100%; min-height: 780px; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--body); line-height: var(--body-lh);
  display: flex; flex-direction: column;
}
[data-component="W42"] * { box-sizing: border-box; }
[data-component="W42"] h1 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
[data-component="W42"] h1 em { font-style: normal; color: var(--gold-text); }
[data-component="W42"] p { margin: 0; }
[data-component="W42"] .wm { font-family: var(--font-display); font-weight: 600; letter-spacing: .01em; }
[data-component="W42"] .wm b { font-family: var(--font-ui); font-weight: 700; color: var(--gold-text); letter-spacing: .02em; }
[data-component="W42"] .micro { font-size: var(--micro); line-height: var(--micro-lh); font-weight: 600; text-transform: uppercase; letter-spacing: var(--micro-tracking); }
/* Language pill: one pill, two halves (ux-context rule 6) */
[data-component="W42"] .lang { display: inline-flex; border: 1px solid var(--glass-edge); border-radius: var(--r-pill); padding: 2px; background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
[data-component="W42"] .lang button { color: var(--ink); }
[data-component="W42"] .lang button { appearance: none; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: var(--caption); font-weight: 600; min-width: 48px; min-height: 36px; border-radius: var(--r-pill); cursor: pointer; }
[data-component="W42"] .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
[data-component="W42"] .btn { appearance: none; cursor: pointer; font: inherit; font-weight: 600; font-size: var(--heading); border-radius: var(--r-pill); border: 0; min-height: 52px; padding: 0 var(--space-6); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); transition: transform var(--t-state) ease-out, background var(--t-state) ease-out; }
[data-component="W42"] .btn:active { transform: scale(.98); }
[data-component="W42"] .btn:focus-visible, [data-component="W42"] button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[data-component="W42"] .btn--primary { background: var(--gold); color: var(--ink-on-gold); }
[data-component="W42"] .opt { appearance: none; cursor: pointer; font: inherit; font-weight: 500; color: var(--ink); text-align: left; min-height: 48px; padding: var(--space-3) var(--space-4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); transition: background var(--t-state) ease-out, border-color var(--t-state) ease-out; }
[data-component="W42"] .opt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-wash); font-weight: 600; }
[data-component="W42"] .opt[aria-pressed="true"]::after { content: " ✓"; color: var(--gold-text); }
[data-component="W42"] .facts { display: flex; flex-wrap: wrap; gap: var(--space-2); list-style: none; padding: 0; margin: 0; }
[data-component="W42"] .facts li { font-size: var(--body-sm); font-weight: 600; padding: var(--space-1) var(--space-3); border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--ink); }
/* Glass: a translucent, blurred panel with a fine edge. No shadow (tokens.css). */
[data-component="W42"] .glass { background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-edge); border-top-color: var(--glass-hi); }
[data-component="W42"] .btn--glass { background: var(--glass-2); color: var(--ink); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-edge); border-top-color: var(--glass-hi); }
[data-component="W42"] .btn--glass-gold { background: color-mix(in srgb, var(--gold) 82%, transparent); color: var(--ink-on-gold); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border: 1px solid color-mix(in srgb, var(--gold) 60%, var(--ink)); }
/* Entrance: one soft rise, staggered. Old phones: transform + opacity only. */
[data-component="W42"] .rise { opacity: 0; transform: translateY(12px); animation: w36rise var(--t-enter) var(--ease) forwards; }
[data-component="W42"] .d1 { animation-delay: 80ms; } [data-component="W42"] .d2 { animation-delay: 160ms; }
[data-component="W42"] .d3 { animation-delay: 240ms; } [data-component="W42"] .d4 { animation-delay: 320ms; }
[data-component="W42"] .d5 { animation-delay: 400ms; }
@keyframes w36rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { [data-component="W42"] .rise { animation: none; opacity: 1; transform: none; } }

/* Words arrive one by one: out of focus, then sharp (the "scan" feeling). */
[data-component="W42"] .w { display: inline-block; opacity: 0; filter: blur(8px); transform: translateY(10px);
  animation: w36word 560ms var(--ease) forwards; animation-delay: calc(var(--base, 0ms) + var(--i) * 70ms); }
@keyframes w36word { to { opacity: 1; filter: none; transform: none; } }
/* Things that float: a slow, small bob so the screen breathes. */
[data-component="W42"] .float { animation: w36float 6s ease-in-out infinite; }
@keyframes w36float { 50% { transform: translateY(-6px); } }
/* The photo drifts slowly behind everything. */
[data-component="W42"] .drift { animation: w36drift 24s ease-in-out infinite alternate; }
@keyframes w36drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -2%); } }
/* A light passes over the main button every few seconds. */
[data-component="W42"] .sheen { position: relative; overflow: hidden; isolation: isolate; }
[data-component="W42"] .sheen::after { content: ""; position: absolute; inset: -20% auto -20% -40%; width: 30%; z-index: -1;
  background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--ink-on-gold) 0%, rgba(255,255,255,.45)), transparent);
  transform: skewX(-18deg); animation: w36sheen 4.5s var(--ease) infinite 1.6s; }
@keyframes w36sheen { 0% { left: -40%; } 35%, 100% { left: 130%; } }
/* Staggered entrance for blocks, driven by --i so the order is the Z order. */
[data-component="W42"] .pop { opacity: 0; transform: translateY(14px) scale(.98); animation: w36pop 480ms var(--ease) forwards;
  animation-delay: calc(var(--base, 0ms) + var(--i, 0) * 90ms); }
@keyframes w36pop { to { opacity: 1; transform: none; } }
[data-component="W42"] .beat[hidden] { display: none; }
[data-component="W42"] .back { appearance: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); font-size: 20px; }
[data-component="W42"] .dots { display: flex; gap: var(--space-1); }
[data-component="W42"] .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line-strong); transition: background var(--t-progress) var(--ease); }
[data-component="W42"] .dots i.on { background: var(--gold); }
[data-component="W42"] .quote { font-family: var(--font-display); font-weight: 600; font-size: var(--title-2); line-height: var(--title-2-lh); color: var(--gold-text); }
[data-component="W42"] .q2 { font-size: var(--body-sm); line-height: var(--body-sm-lh); color: var(--ink-2); }
[data-component="W42"] .promise { color: var(--ink-2); }
[data-component="W42"] .qtitle { font-family: var(--font-display); font-weight: 600; font-size: var(--display-2); line-height: var(--display-2-lh); margin: 0; }
[data-component="W42"] .opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--tile-gap); }
[data-component="W42"] .opts .opt { min-height: 104px; border-radius: var(--r-lg); background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-color: var(--glass-edge); border-top-color: var(--glass-hi); font-size: var(--heading); font-weight: 600; display: flex; align-items: flex-end; }
[data-component="W42"] .opts .opt[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold-wash) 82%, transparent); }
@media (prefers-reduced-motion: reduce) {
  [data-component="W42"] .w, [data-component="W42"] .pop { animation: none; opacity: 1; filter: none; transform: none; }
  [data-component="W42"] .float, [data-component="W42"] .drift, [data-component="W42"] .sheen::after { animation: none; }
}


[data-component="W42"] { min-height: 100dvh; padding: var(--space-4); gap: var(--space-4); }
[data-component="W42"] .top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
[data-component="W42"] .right { display: flex; align-items: center; gap: var(--space-2); }
[data-component="W42"] h1 { font-size: var(--display-2); line-height: var(--display-2-lh); }
[data-component="W42"] .ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--gold-text); flex: none; }
[data-component="W42"] .btn--line { background: transparent; color: var(--ink); border: 1px solid var(--line-strong); min-height: 48px; font-size: var(--body); }
[data-component="W42"] .nophoto { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--r-lg); border: 1px dashed var(--line-strong); }
[data-component="W42"] .np-t { font-weight: 600; } [data-component="W42"] .np-l { color: var(--ink-2); font-size: var(--body-sm); line-height: var(--body-sm-lh); }
[data-component="W42"] .end { display: flex; flex-direction: column; gap: var(--space-2); margin-top: auto; }
[data-component="W42"] .end[hidden] { display: none; }
[data-component="W42"] .sign { text-align: center; font-size: var(--caption); color: var(--ink-2); }
[data-component="W42"] .mail { font-size: var(--caption); color: var(--ink-2); text-align: center; user-select: all; -webkit-user-select: all; }

(function () {
  var root = document.querySelector('[data-component="W42"]');
  // Language: swaps every [data-en]/[data-nl] string.
  root.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      var lang = b.dataset.lang;
      root.querySelectorAll('.lang button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
      root.querySelectorAll('[data-' + lang + ']').forEach(function (el) { el.innerHTML = el.getAttribute('data-' + lang); });
      root.setAttribute('lang', lang);
    });
  });
  // "What brings you here?" — one choice, tap again to clear.
  root.querySelectorAll('.opt').forEach(function (o) {
    o.addEventListener('click', function () {
      var on = o.getAttribute('aria-pressed') !== 'true';
      root.querySelectorAll('.opt').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      o.setAttribute('aria-pressed', on);
    });
  });
  // The main button leads to screen 2, which is not built yet: say so honestly.
  root.querySelectorAll('[data-next]').forEach(function (b) {

      var n = document.querySelector('.harness__note');
      if (n) { n.textContent = 'Next: screen 2 · How it works (not built yet)'; }
    });
  });
  
  // Split marked text into words so each can arrive on its own.
  function split(el) {
    var i = 0, nodes = Array.prototype.slice.call(el.childNodes);
    el.textContent = '';
    nodes.forEach(function (n) {
      if (n.nodeType === 3) {
        n.textContent.split(/(\s+)/).forEach(function (part) {
          if (!part) return;
          if (/^\s+$/.test(part)) { el.appendChild(document.createTextNode(' ')); return; }
          var s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', i++); s.textContent = part; el.appendChild(s);
        });
      } else { var w = document.createElement('span'); w.className = 'w'; w.style.setProperty('--i', i++); w.appendChild(n); el.appendChild(w); }
    });
  }

  var F = [{"key": "texture", "label": ["Texture", "Structuur"], "pre": ["Your hair looks", "Je haar lijkt"], "word": ["wavy", "golvend"], "zoom": "250%", "pos": "50% 4%", "mark": [18, 2, 64, 26], "options": [["Straight, fine", "Steil, fijn"], ["Straight, coarse", "Steil, grof"], ["Wavy", "Golvend"], ["Curly", "Krullend"], ["Coily", "Kroes"]], "guess": 2}, {"key": "colour", "label": ["Colour", "Kleur"], "pre": ["Your colour looks", "Je kleur lijkt"], "word": ["dark brown with grey", "donkerbruin met grijs"], "zoom": "300%", "pos": "30% 8%", "mark": [22, 6, 30, 20], "options": [["Black", "Zwart"], ["Dark brown", "Donkerbruin"], ["Dark brown with grey", "Donkerbruin met grijs"], ["Light brown", "Lichtbruin"], ["Blond", "Blond"], ["Mostly grey", "Vooral grijs"]], "guess": 2}, {"key": "hairline", "label": ["Hairline", "Haarlijn"], "pre": ["Your hairline sits", "Je haarlijn ligt"], "word": ["a little higher at the temples", "iets hoger bij de slapen"], "zoom": "240%", "pos": "50% 22%", "mark": [24, 20, 52, 12], "options": [["Straight across", "Recht"], ["A little higher at the temples", "Iets hoger bij de slapen"], ["Clearly higher at the temples", "Duidelijk hoger bij de slapen"], ["Higher all along the front", "Overal wat hoger"]], "guess": 1}], idx = 0, answers = [], lang = 'en';
  var $ = function (s) { return root.querySelector(s); };
  function L(pair) { return pair[lang === 'nl' ? 1 : 0]; }
  function statement(f, value) {
    var word = value != null ? L(f.options[value]).toLowerCase() : L(f.word);
    return L(f.pre) + ' <em>' + word + '</em>';
  }
  function render(dir) {
    var done = idx >= F.length;
    root.classList.toggle('is-done', done);
    root.querySelectorAll('[data-count]').forEach(function (e) { e.textContent = Math.min(idx + 1, F.length) + ' / ' + F.length; });
    root.querySelectorAll('.seg').forEach(function (s, i) { s.classList.toggle('lit', i < idx); s.classList.toggle('now', i === idx); });
    var list = $('.sofar'); if (list) list.innerHTML = answers.map(function (a, i) { return '<li><span>' + L(F[i].label) + '</span><b>' + (a.value != null ? L(F[i].options[a.value]) : L(F[i].word)) + '</b></li>'; }).join('');
    var opts = $('.options'); opts.hidden = true; opts.innerHTML = '';
    root.classList.remove('is-asking');
    if (done) return;
    var f = F[idx];
    root.querySelectorAll('.photo').forEach(function (p) { p.style.backgroundSize = p.dataset.full ? 'cover' : f.zoom; p.style.backgroundPosition = p.dataset.full ? 'center 20%' : f.pos; });
    var m = $('.mark'); if (m) { m.style.left = f.mark[0] + '%'; m.style.top = f.mark[1] + '%'; m.style.width = f.mark[2] + '%'; m.style.height = f.mark[3] + '%'; m.dataset.label = L(f.label); }
    root.querySelectorAll('[data-label]').forEach(function (e) { if (e.classList.contains('mark') || e.classList.contains('spot')) e.dataset.label = L(f.label); else e.textContent = L(f.label); });
    var st = $('.statement'); st.innerHTML = statement(f); split(st);
    var bw = $('.bigword'); if (bw) { bw.textContent = L(f.word); bw.style.animation = 'none'; bw.offsetWidth; bw.style.animation = ''; }
    var card = $('.fcard'); if (card) { card.style.transition = 'none'; card.style.transform = dir ? 'translateX(' + (dir * 40) + 'px) scale(.97)' : ''; card.style.opacity = dir ? 0 : 1; card.offsetWidth; card.style.transition = ''; card.style.transform = ''; card.style.opacity = 1; }
    root.querySelectorAll('.pop').forEach(function (p) { p.style.animation = 'none'; p.offsetWidth; p.style.animation = ''; });
  }
  function yes() { if (idx >= F.length) return; answers.push({ value: null }); idx++; render(1); }
  function no() {
    if (idx >= F.length) return; var f = F[idx], opts = $('.options');
    root.classList.add('is-asking');
    opts.innerHTML = '<p class="micro">' + L(T.pick) + '</p>' + f.options.map(function (o, i) {
      return '<button type="button" class="optrow' + (i === f.guess ? ' guess' : '') + '" data-i="' + i + '">' + L(o) + (i === f.guess ? ' <small>' + L(T.aiguess) + '</small>' : '') + '</button>';
    }).join('');
    opts.hidden = false;
    opts.querySelectorAll('.optrow').forEach(function (b) { b.addEventListener('click', function () { answers.push({ value: +b.dataset.i }); idx++; render(1); }); });
  }
  var T = {"pick": ["Which is closer?", "Wat klopt beter?"], "aiguess": ["our reading", "onze lezing"]};
  root.querySelectorAll('[data-yes]').forEach(function (b) { b.addEventListener('click', yes); });
  root.querySelectorAll('[data-no]').forEach(function (b) { b.addEventListener('click', no); });
  root.querySelector('[data-again]').addEventListener('click', function () { idx = 0; answers = []; render(); });
  root.querySelectorAll('.lang button').forEach(function (b) { b.addEventListener('click', function () { lang = b.dataset.lang; render(); }); });
  // Swipe (variant with a card): drag right = yes, left = no.
  var card = $('.fcard');
  if (card && card.hasAttribute('data-swipe')) {
    var x0 = null;
    card.addEventListener('pointerdown', function (e) { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', function (e) { if (x0 === null) return; var dx = e.clientX - x0; card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 25 + 'deg)'; card.dataset.lean = dx > 40 ? 'yes' : dx < -40 ? 'no' : ''; });
    card.addEventListener('pointerup', function (e) { var dx = e.clientX - x0; x0 = null; card.style.transition = ''; card.style.transform = ''; card.dataset.lean = ''; if (dx > 90) yes(); else if (dx < -90) no(); });
  }
  render();

})();

document.getElementById('theme-flip').addEventListener('click', function () {
  var el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
// Theme check: press T to flip.
document.addEventListener('keydown', function (e) {
  if (e.key.toLowerCase() !== 't') return;
  var el = document.documentElement;
  el.setAttribute('data-theme', el.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
