<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#141210">
<title>PleromaOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --ink:#f4efe6; --ink-2:#b3a894; --ink-3:#908674;
  --bg:#141210; --panel:#1c1917; --panel-2:#242019; --line:#332c24;
  --gold:#c9a96e; --gold-lo:#9c8555; --gold-bg:#2a2317;
  --teal:#4a7a5c; --teal-bg:#1a2a1f;
  --warn:#c98a4e; --hot:#c96b56;
  --r:14px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.stage{display:flex;flex-direction:column;align-items:center;padding:22px 16px 0;min-height:100vh}
.plate{width:100%;max-width:430px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wm{font-family:"Instrument Serif",Georgia,serif;font-size:19px;letter-spacing:-.01em}
.wm b{font-weight:400}
.wm span{color:var(--gold);font-weight:400}
.tagline{font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.plate .sp{flex:1}
.ghost{
  font:inherit;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;border:1px solid var(--line);color:var(--ink-3);
  border-radius:99px;padding:5px 11px;cursor:pointer
}
.ghost:hover{border-color:var(--gold);color:var(--gold)}
.ghost.on{background:var(--gold-bg);border-color:var(--gold-lo);color:var(--gold)}
.ghost:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── phone ── */
.phone{
  width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);
  border-radius:26px;overflow:hidden;display:flex;flex-direction:column;
  height:min(780px,calc(100vh - 130px));box-shadow:0 30px 70px -30px rgba(0,0,0,.8);
}
.bar{padding:12px 16px 0;flex:none}
.prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.crumb{display:flex;align-items:center;gap:10px;padding:9px 2px 0;font-size:11px;color:var(--ink-3)}
.crumb .step{color:var(--ink-3)}
.sidchip{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--gold-lo);border:1px solid var(--line);border-radius:6px;padding:3px 8px;display:none}
.sidchip.show{display:inline-block}
.crumb .sp{flex:1}
.back{background:none;border:none;color:var(--ink-3);font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.back:hover{color:var(--ink)}
.back[hidden]{visibility:hidden}

.scr{flex:1;overflow-y:auto;padding:14px 18px 20px;scrollbar-width:thin}
.scr::-webkit-scrollbar{width:5px}
.scr::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.q{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:27px;
   line-height:1.15;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.sub{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}

/* ── option rows ── */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:baseline;gap:11px;width:100%;text-align:left;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;color:var(--ink);font:inherit;cursor:pointer;transition:.14s
}
.opt:hover{border-color:var(--gold-lo)}
.opt.sel{border-color:var(--gold);background:var(--gold-bg)}
.opt .lb{font-weight:500;font-size:15.5px}
.opt .ht{font-size:12.5px;color:var(--ink-3);margin-left:auto;text-align:right;max-width:52%}
.opt.dis{opacity:.45;cursor:not-allowed;background:transparent}
.opt.dis:hover{border-color:var(--line)}
.opt.dis .lb{color:var(--ink-3)}
.opt .why{font-size:11.5px;color:var(--ink-3);margin-left:auto;font-style:italic;text-align:right;max-width:56%}
.opt.quiet{background:transparent;border-style:dashed}
.opt.quiet .lb{color:var(--ink-2);font-weight:400}
.opt.primary{border-color:var(--gold-lo);background:var(--gold-bg)}
.opt.primary .lb{font-size:16.5px}
.optwrap{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.optwrap .cost{font-size:12px;color:var(--gold)}
.opt.stacked{align-items:center}
.opt.stacked .ht{margin-left:0;max-width:none;text-align:left;font-size:12.5px;color:var(--ink-2)}
.opt .pre{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
  border:1px solid var(--gold-lo);border-radius:99px;padding:2px 7px;margin-left:auto;white-space:nowrap}

/* ── style grid ── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:8px 6px 9px;cursor:pointer;color:var(--ink);font:inherit;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:.14s
}
.tile:hover{border-color:var(--gold-lo)}
.tile.sel{border-color:var(--gold);background:var(--gold-bg)}
.tile svg{width:100%;height:auto;display:block}
.tile .nm{font-size:11px;line-height:1.25;text-align:center;font-weight:500}
.tile .mn{font-size:8.5px;letter-spacing:.03em;padding:2px 6px;border-radius:99px;white-space:nowrap}
.mn-low{background:var(--teal-bg);color:var(--teal)}
.mn-medium{background:var(--gold-bg);color:var(--warn)}
.mn-high{background:#2e1e1a;color:var(--hot)}
.mn-variable{background:var(--panel);color:var(--ink-3)}
.gridnote{font-size:12.5px;color:var(--ink-2);margin:0 0 14px;padding:10px 12px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:10px;line-height:1.45}
.ghdr{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);
  margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.ghdr:first-child{margin-top:0}
.ghdr::after{content:'';flex:1;height:1px;background:var(--line)}
.gridnote b{color:var(--gold)}

/* ── preview ── */
.pv{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;text-align:center;margin-bottom:14px}
.pv svg{width:130px;height:auto;margin:0 auto 12px;display:block}
.pv .t{font-family:"Instrument Serif",Georgia,serif;font-size:22px;margin-bottom:3px}
.pv .c{font-size:13px;color:var(--ink-2)}
.swatches{display:flex;gap:9px;justify-content:center;margin-top:14px}
.sw{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);cursor:pointer;transition:.14s}
.sw:hover{transform:scale(1.06)}
.sw.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg)}
.sw-light{background:#e8c9a8}.sw-medium{background:#b07f52}.sw-deep{background:#6b452c}

/* ── summary ── */
.sum{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.sgrp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  margin:15px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.sgrp:first-child{margin-top:4px}
.srow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid rgba(51,44,36,.5)}
.srow dt{font-size:12.5px;color:var(--ink-3);flex:0 0 40%}
.srow dd{margin:0;font-size:14px;flex:1;font-weight:500}
.srow button{background:transparent;border:1px solid var(--line);border-radius:8px;
  color:var(--gold-lo);font:inherit;font-size:12px;cursor:pointer;padding:7px 12px;
  min-height:34px;flex:none}
.srow button:hover{border-color:var(--gold);color:var(--gold)}
.srow dd.empty{color:var(--ink-3);font-weight:400;font-style:italic}
.flag{background:#2a1f14;border:1px solid #4a3520;border-left:3px solid var(--warn);
  border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);margin:12px 0}
.flag b{color:var(--warn)}

/* ── form / cta ── */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.field input,.field select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;color:var(--ink);font:inherit;font-size:15px
}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.field input::placeholder{color:var(--ink-3)}
.field .err{font-size:12.5px;color:var(--hot);margin-top:6px;display:none}
.field.bad .err{display:block}
.field.bad input,.field.bad select{border-color:var(--hot)}
.cta{
  width:100%;background:var(--gold);border:none;border-radius:12px;padding:14px;
  color:#1a1610;font:inherit;font-weight:600;font-size:15.5px;cursor:pointer;margin-top:4px
}
.cta:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.cta.alt{background:transparent;border:1px solid var(--line);color:var(--ink-2);margin-top:8px}
.cta.alt:hover{border-color:var(--gold-lo);color:var(--ink)}
.skip{display:block;width:100%;background:transparent;border:1px solid var(--line);
  border-radius:12px;color:var(--ink-2);font:inherit;font-size:14px;cursor:pointer;
  padding:12px;margin-top:10px}
.skip:hover{border-color:var(--gold-lo);color:var(--ink)}
.done{text-align:center;padding:36px 10px}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--teal-bg);color:var(--teal);
  display:grid;place-items:center;font-size:26px;margin:0 auto 16px}
.done h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:25px;margin:0 0 8px}
.done p{color:var(--ink-2);font-size:14px;margin:0 0 20px}

/* ── inspector ── */
.insp{width:100%;max-width:430px;margin:12px 0 30px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.insp[hidden]{display:none}
.insp h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);
  margin:0;padding:12px 15px 9px;border-bottom:1px solid var(--line)}
.insp .body{padding:13px 15px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;line-height:1.65}
.insp .kv{display:flex;gap:9px;color:var(--ink-2)}
.insp .kv b{color:var(--ink-3);font-weight:400;flex:0 0 116px}
.insp .kv span{color:var(--ink)}
.insp .sec{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.insp .sk{color:var(--ink-3)}
.insp .sk em{color:var(--warn);font-style:normal}
.insp .path{color:var(--gold-lo);word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .stage{padding:12px 10px 0}
  .phone{border-radius:20px;height:calc(100vh - 108px)}
  .grid{gap:6px}
}

/* ══ added for app.html — see docs/HANDOFF-quiz-app.md §6 step 1 ══ */

/* ── access gate ── */
#gate{max-width:340px;margin:0 auto;padding:15vh 22px 40px;text-align:center}
#gate .wm{display:block;font-size:27px;margin-bottom:16px}
#gate p{color:var(--ink-3);font-size:13.5px;line-height:1.6;margin:0 0 22px}
#code{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;font-size:17px;text-align:center;
  letter-spacing:.22em;text-transform:uppercase}
#code:focus{outline:0;border-color:var(--gold-lo)}
#enter{width:100%;margin-top:10px;padding:15px;border-radius:12px;border:0;
  background:var(--gold);color:#1a1610;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
#gateErr{color:var(--hot);font-size:13px;margin-top:13px;min-height:19px}
#gate[hidden],#app[hidden]{display:none!important}

/* ── full bleed on a real phone: no phone-in-a-phone ── */
@media (max-width:560px){
  /* the panel colour goes on .stage, not body, so the gate keeps the darker
     ground and the code input still reads as a raised field against it */
  .stage{background:var(--panel);padding:0;height:100dvh;min-height:100dvh;align-items:stretch}
  .plate{max-width:none;margin:0;flex:none;gap:8px;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 9px) 13px 9px}
  .plate .tagline{display:none}
  .wm{font-size:17px}
  .ghost{padding:5px 9px;font-size:10.5px}
  .phone{max-width:none;height:auto;flex:1 1 auto;min-height:0;
    border:0;border-radius:0;box-shadow:none}
  .scr{padding-bottom:calc(env(safe-area-inset-bottom) + 22px)}
  /* the inspector becomes a bottom sheet - a full-height screen leaves no room below it */
  .insp{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:none;margin:0;
    max-height:62dvh;overflow-y:auto;border-radius:16px 16px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -20px 50px -20px rgba(0,0,0,.85)}
}

/* ── photo / model fork and the AI preview (P0, P0a, P0b, P1) ── */
label.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 18px;
  cursor:pointer;background:var(--panel-2);text-align:center}
label.drop b{font-size:15px;color:var(--ink);font-weight:500}
label.drop small{color:var(--ink-3);font-size:12.5px}
label.drop input{display:none}
label.drop[hidden]{display:none}
.shot{width:100%;border-radius:var(--r);border:1px solid var(--line);display:block;cursor:pointer}
.shot[hidden]{display:none}
.fine{font-size:12px;color:var(--ink-3);line-height:1.6;margin:14px 0 0}
.avgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);
  padding:6px;cursor:pointer;font:inherit;color:var(--ink-2)}
.av img{width:100%;border-radius:9px;display:block;aspect-ratio:1;object-fit:cover}
.av span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  margin-top:6px;text-align:center}
.av.sel{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.empty{border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;
  background:var(--panel-2);color:var(--ink-2);font-size:13.5px;line-height:1.65;margin-bottom:12px}
.wait{border:1px solid var(--line);border-radius:var(--r);padding:16px;
  background:var(--panel-2);margin-bottom:14px}
.wait .lbl{font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:9px}
.wait .track{height:3px;background:var(--line);border-radius:99px;margin-top:13px;overflow:hidden}
.wait .track i{display:block;height:100%;width:8%;background:var(--gold);border-radius:99px;
  transition:width .9s linear}
.wait .note{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.6}
.spin{width:13px;height:13px;border:2px solid var(--gold-lo);border-top-color:transparent;
  border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ba figure{margin:0}
.ba img{width:100%;border-radius:11px;border:1px solid var(--line);display:block;cursor:zoom-in}
.ba figcaption{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:7px;text-align:center}
.warnbox{border:1px solid var(--line);border-left:2px solid var(--warn);border-radius:8px;
  padding:12px 13px;background:var(--panel-2);color:var(--ink-2);font-size:13px;
  line-height:1.6;margin-bottom:13px}
#lb{position:fixed;inset:0;background:rgba(8,7,6,.96);display:none;z-index:99;
  align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:86dvh;border-radius:10px}
#lbx{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:16px;font-size:30px;
  color:var(--ink-2);background:none;border:0;cursor:pointer;line-height:1;padding:8px}
</style>
</head>
<body>

<div id="gate">
  <span class="wm"><b>Pleroma</b><span>OS</span></span>
  <p>Internal preview. Enter your access code.</p>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"
         placeholder="CODE" aria-label="Access code">
  <button id="enter" type="button">Enter</button>
  <div id="gateErr" role="alert"></div>
</div>

<div id="app" hidden>

<div id="lb" role="dialog" aria-label="Full size image">
  <button id="lbx" type="button" aria-label="Close">&times;</button>
  <img id="lbi" alt="">
</div>

<div class="stage">
  <div class="plate">
    <span class="wm"><b>Pleroma</b><span>OS</span></span>
    <span class="tagline">Prototype</span>
    <span class="sp"></span>
    <span class="sidchip" id="sidchip">S0</span>
    <button class="ghost" id="itog">Show logic</button>
    <button class="ghost" id="rst">Restart</button>
  </div>

  <div class="phone">
    <div class="bar">
      <div class="prog"><i id="fill"></i></div>
      <div class="crumb">
        <button class="back" id="back" hidden>← Back</button>
        <span class="sp"></span>
        <span class="step" id="step"></span>
      </div>
    </div>
    <div class="scr" id="scr"></div>
  </div>

  <div class="insp" id="insp" hidden>
    <h3>What the quiz is doing</h3>
    <div class="body" id="ibody"></div>
  </div>
</div>
</div>

<script>

// ── access gate ────────────────────────────────────────────────────────────
// Obscurity, not security: anyone who views source can read this code. It keeps
// the page off the radar of whoever stumbles on the URL, and must not be
// mistaken for auth. Same posture as tryon.html, its own storage key so
// unlocking one page does not unlock the other.
var CODE = "PLEROMA26";
function unlock(){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden = false;
}
try{ if(sessionStorage.getItem('pl_app_ok') === '1') unlock(); }catch(e){}
function tryCode(){
  var v = (document.getElementById('code').value || '').trim().toUpperCase();
  if(v === CODE){
    try{ sessionStorage.setItem('pl_app_ok','1'); }catch(e){}
    unlock();
  } else {
    document.getElementById('gateErr').textContent = 'That code is not right.';
  }
}
document.getElementById('enter').onclick = tryCode;
document.getElementById('code').addEventListener('keydown', function(e){
  if(e.key === 'Enter') tryCode();

// A raw phone photo is 4-12MB, slow to post and pointless at the resolution the
// model works at. Same 1280 / 0.88 as tryon.html.
function shrink(img, cb){
  const max = 1280;
  let w = img.width, h = img.height;
  if (w > max || h > max){ const s = max / Math.max(w,h); w = Math.round(w*s); h = Math.round(h*s); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  // a cross-origin image taints the canvas and toDataURL throws. Models are
  // served from this same origin so it should not happen - but a silent throw
  // here would leave the client tapping a tile that does nothing.
  try { cb(c.toDataURL('image/jpeg', 0.88), w, h); }
  catch (e) { cb(null, w, h); }
}
function downscale(file, cb){
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => { const im = new Image(); im.onload = () => shrink(im, cb); im.src = ev.target.result; };
  r.readAsDataURL(file);
}
function urlToPhoto(url, cb){          // models are same-origin, so no CORS dance
  const im = new Image();
  im.crossOrigin = 'anonymous';        // harmless here, needed if they ever move to a CDN
  im.onload  = () => shrink(im, cb);
  im.onerror = () => cb(null);
  im.src = url;
}

// quiz answers -> what hair-transfer takes. The field names already line up with

function renderPayload(){

    styleId:     t.id,
    texture:     S.S0b,
    sides:       S.S5 || null,
    fadeHeight:  (S.S6 && S.S6 !== 'barbers-choice') ? S.S6 : null,

    // face the identity lock is trying to hold still.
    beard:       S.S10 || 'none',
    photoBase64: S.photoData
  };
}

function repaintP1(){ if (cur === 'P1') render(); }

async function startRender(){
  job = { state:'submitting', t0: Date.now(), usedReference: undefined };
  repaintP1();
  try{
    const res = await fetch(API, { method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(renderPayload()) });
    const j = await res.json();
    if (j.error) throw new Error(j.error);
    job.renderId = j.renderId;
    job.usedReference = j.usedReference || null;
    job.state = 'running';
    repaintP1();
    poll();
  }catch(e){
    job.state = 'failed'; job.error = e.message; repaintP1();
  }
}

async function poll(){
  const mine = job;
  for (let i = 0; i < 60; i++){
    await new Promise(r => setTimeout(r, 3000));
    if (job !== mine || job.state !== 'running') return;   // superseded by a retry
    try{
      const s = await (await fetch(API + '?renderId=' + job.renderId)).json();
      if (s.status === 'succeeded'){
        job.state = 'done'; job.outputUrl = s.outputUrl;
        if (s.usedReference !== undefined) job.usedReference = s.usedReference || null;
        job.secs = Math.round((Date.now() - job.t0) / 1000);
        repaintP1(); return;
      }
      if (s.status === 'failed'){
        job.state = 'failed'; job.error = s.error || 'the render did not finish';
        repaintP1(); return;
      }
    }catch(e){ /* a dropped poll is not a failed render - keep trying */ }
  }
  job.state = 'failed'; job.error = 'it took longer than three minutes'; repaintP1();
}

// ticks the waiting screen in place - a full re-render every second would throw
// away the client's scroll position
function tickWait(){
  clearTimeout(waitTimer);
  const lbl = $('#wlbl'); if (!lbl || !job) return;
  const secs = Math.round((Date.now() - job.t0) / 1000);
  lbl.textContent = job.state === 'submitting' ? 'Sending your photo\u2026' : 'Cutting your hair\u2026';
  $('#wbar').style.width = Math.min(96, 8 + secs * 3) + '%';
  $('#wnote').textContent = 'About 30 seconds. ' + secs + 's so far \u2014 you can leave this screen open.';
  if (job.state === 'submitting' || job.state === 'running') waitTimer = setTimeout(tickWait, 1000);
}

  'medium':     'M24 52c0-23 14-37 36-37s36 14 36 37c0 6-1 10-3 13-2-16-14-26-33-26s-31 10-33 26c-2-3-3-7-3-13z',

function tileSvg(st, sz) {
  const w = sz || 74;
  return `<svg viewBox="0 0 120 108" width="${w}" aria-hidden="true">
    <ellipse cx="60" cy="66" rx="27" ry="32" fill="#2f2820"/>
    <path d="${HAIR[st.len]}" fill="var(--gold-lo)"/>
    <circle cx="50" cy="66" r="2" fill="#4a4034"/><circle cx="70" cy="66" r="2" fill="#4a4034"/>
  </svg>`;
}

// ── flow ──
function go(id, opt) {
  if (cur) hist.push(cur);
  cur = id; render(opt);
}
function skip(id, why) { skipped.push({ id, why }); }
function back() {
  if (!hist.length) return;
  cur = hist.pop(); render();
}
// after answering `id`, work out what comes next
function next(id) {
  if (editing) { const e = editing; editing = null; return go('S17'); }
  const n = {
    S0:  () => S.S0 === 'male' ? go('S0b') : go('FEMALE'),
    S0b: () => go('S0c'),
    S0c: () => go('SR'),
    SR:  () => S.SR === 'preset' ? go('A1') : go('S1'),
    A1:  () => S.A1 === '__photo__' ? go('A1b') : go('SE'),
    A1b: () => go('SE'),
    S1:  () => go('S1b'),
    S1b: () => {
      if (S.S1b === 'change') return go('S1c');
      // a question with one possible answer isn't a question - fill it and move on
      const allowed = byId(S.S1).allowedCurrentLength;
      if (allowed.length === 1) {
        S.S2 = allowed[0];
        skip('S2', `only "${allowed[0]}" is possible with a ${byId(S.S1).display.toLowerCase()} - filled automatically`);
        return go('S3');
      }
      return go('S2');
    },
    S1c: () => {
      const a = LEN.indexOf(byId(S.S1).len), b = LEN.indexOf(byId(S.S1c).len);
      S.derivedDir = b > a ? 'longer' : b < a ? 'shorter' : 'keep';
      skip('S2', 'length known from the style picked at S1');
      skip('S3', 'direction derived: ' + S.derivedDir);
      skip('S4', 'target already chosen at S1c');
      go('SE');
    },
    S2:  () => go('S3'),
    S3:  () => {
      if (S.S3 === 'keep') { skip('S4', 'no length change wanted'); return go('SE'); }
      go('S4');
    },
    S4:  () => go('SE'),
    SE:  () => {
      if (route === 'preset') {
        // the preset fills the CUT. it says nothing about facial hair, so the beard
        // section still runs - otherwise a bearded client gets a brief saying "no beard".
        ['S5','S6','S7','S8','S9'].forEach(x => skip(x, 'filled by the ' + byId(S.A1).display + ' preset'));
        return go('S10');
      }
      go('S5');
    },
    S5:  () => {
      if (FADE.has(S.S5)) return go('S6');
      if (TAPER.has(S.S5)) { skip('S7', 'shape only applies to a fade'); return go('S6'); }
      skip('S6', 'no fade or taper chosen'); skip('S7', 'no fade chosen');
      go('S8');
    },
    S6:  () => FADE.has(S.S5) ? go('S7') : go('S8'),
    S7:  () => go('S8'),
    S8:  () => go('S9'),
    S9:  () => go('S10'),
    S10: () => {
      if (S.S10 === 'none') {
        ['S11','S12','S13','S15','S16b'].forEach(x => skip(x, 'clean shaven'));
        return go('S14');
      }
      skip('S14', 'already has a beard');
      go('S11');
    },
    S11: () => go('S12'),
    S12: () => go('S13'),
    S13: () => go('S15'),
    S14: () => S.S14 === 'yes' ? go('S14b') : (skip('S14b','no touch-up wanted'), go('S16c')),
    S14b:() => go('S16c'),
    S15: () => go('S16b'),
    S16b:() => go('S16c'),
    // the photo route never picks a style, so target() is null and there is
    // nothing to preview. Skip P1 rather than throw.
    S16c:() => target() ? go('P0')
           : (skip('P0', 'no style chosen \u2014 you sent a photo instead'),
              skip('P1', 'nothing to preview'), go('S17')),
    P0:  () => S.P0 === 'face' ? go('P0a') : go('P0b'),
    P0a: () => go('P1'),
    P0b: () => go('P1'),
    P1:  () => go('S17'),
    S17: () => go('S18'),
  }[id];
  n ? n() : go('S17');
}

function pick(id, v) {
  S[id] = v;
  if (id === 'SR') { route = v; }
  if (id === 'A1' && v !== '__photo__') {
    route = 'preset';
    Object.assign(S, byId(v).presetAnswers);
  }
  if (id === 'A1' && v === '__photo__') route = 'photo';
  if (id === 'S1b' && v === 'keep') S.S1c = S.S1;
  if (id === 'S5') { delete S.S6; delete S.S7; }
  next(id);
}

// ── the style the brief is actually about ──
function target() {
  if (route === 'preset') return byId(S.A1);
  if (S.S4) return byId(S.S4);
  if (S.S1c) return byId(S.S1c);
  if (S.S1) return byId(S.S1);
  return null;
}
function availableStyles() {
  const t = S.S0b;
  return D.styles.filter(s => s.textures.includes(t));
}
// S4: direction + family similarity + texture, top 3
function alternatives() {
  const from = byId(S.S1), dir = S.S3, fi = LEN.indexOf(from.len);
  const sim = D.similarFamilies[from.family] || [];
  return availableStyles()
    .filter(s => {
      const i = LEN.indexOf(s.len);
      return dir === 'shorter' ? i < fi : i > fi;
    })
    .map(s => {
      let sc = 0;
      if (s.family === from.family) sc += 3;
      else if (sim.includes(s.family)) sc += 2;
      sc += 2 - Math.min(2, Math.abs(LEN.indexOf(s.len) - fi) - 1);
      return { s, sc };
    })
    .sort((a, b) => b.sc - a.sc).slice(0, 3).map(x => x.s);
}
function effortMismatch() {
  const t = target(); if (!t || !S.SE) return null;
  const rank = { Low: 1, Medium: 2, High: 3, Variable: 2 };
  const m = rank[t.maintenance], e = rank[{ low: 'Low', medium: 'Medium', high: 'High' }[S.SE]];
  if (m - e >= 2) return `${t.display} is ${t.maintenance.toLowerCase()}-upkeep, but you want ${S.SE} daily effort.`;
  return null;
}
function longTransition() {
  if (!S.S1 || !S.S1c || S.S1 === S.S1c) return null;
  const a = LEN.indexOf(byId(S.S1).len), b = LEN.indexOf(byId(S.S1c).len);
  if (Math.abs(b - a) < 2) return null;
  return b > a
    ? `Going from ${byId(S.S1).lenLabel.toLowerCase()} to ${byId(S.S1c).lenLabel.toLowerCase()} takes a few months of growing out.`
    : `That's a big cut — ${byId(S.S1).lenLabel.toLowerCase()} down to ${byId(S.S1c).lenLabel.toLowerCase()}.`;
}

// ── rendering ──
// how many screens are actually left on the path the client is on
function stepsLeft() {
  if (cur === 'DONE') return 0;
  const after = { P0:5, P0a:4, P0b:4, P1:3, S17:2, S18:1, DONE:0 };
  if (after[cur] != null) return after[cur];
  // every path now passes through P0 and one of P0a/P0b before the preview
  if (route === 'preset') return 2 + (({ S0:8, S0b:7, S0c:6, SR:5, A1:4, A1b:4, SE:3 })[cur] ?? 4);
  if (route === 'photo')  return 2 + (({ A1b:12, SE:11, S5:10, S6:9, S7:8, S8:8, S9:7, S10:6,
                                    S11:5, S12:5, S13:4, S14:4, S14b:4, S15:4, S16b:4, S16c:3 })[cur] ?? 6);
  return 2 + (({ S0:14, S0b:13, S0c:12, SR:11, S1:10, S1b:9, S1c:8, S2:9, S3:8, S4:8, SE:7,
            S5:6, S6:6, S7:5, S8:5, S9:4, S10:4, S11:4, S12:4, S13:4, S14:4, S14b:4,
            S15:4, S16b:4, S16c:3 })[cur] ?? 5);
}
function render() {
  const scr = $('#scr'); scr.innerHTML = ''; scr.scrollTop = 0;
  $('#sidchip').textContent = cur;
  $('#back').hidden = !hist.length || cur === 'DONE';
  const left = cur === 'FEMALE' ? 0 : stepsLeft();
  $('#step').textContent = cur === 'FEMALE' ? ''
    : cur === 'DONE' ? 'Done'
    : left <= 0 ? 'Last one'
    : left === 1 ? '1 screen left'
    : left + ' screens left';
  const pct = cur === 'DONE' ? 100 : Math.max(4, Math.round(100 * (1 - left / (hist.length + left || 1))));
  $('#fill').style.width = pct + '%';
  (R[cur] || R.FALLBACK)(scr);
  inspect();
}
function head(scr, q, sub) {
  scr.append(el('h1', 'q', q));
  if (sub) scr.append(el('p', 'sub', sub));
}
function optList(scr, id, list, o) {
  o = o || {};
  const box = el('div', 'opts'); 
  list.forEach(op => {
    const dis = o.allow && !o.allow.includes(op.value);
    const quiet = op.value === 'barbers-choice';
    const b = el('button', 'opt' + (S[id] === op.value ? ' sel' : '') + (dis ? ' dis' : '') + (quiet ? ' quiet' : ''));
    b.innerHTML = `<span class="lb">${op.label}</span>` +
      (dis ? `<span class="why">${o.whyDisabled || 'not possible here'}</span>`
           : op.hint ? `<span class="ht">${op.hint}</span>` : '') +
      (o.prefill === op.value && !dis ? `<span class="pre">usual for this cut</span>` : '');
    if (dis) b.disabled = true;
    else b.onclick = () => pick(id, op.value);
    box.append(b);
  });
  scr.append(box);
}
const UPKEEP = { Low: 'Low upkeep', Medium: 'Some upkeep', High: 'High upkeep', Variable: 'Varies' };
function tileBtn(id, st) {
  const b = el('button', 'tile' + (S[id] === st.slug ? ' sel' : ''));
  b.innerHTML = tileSvg(st) +
    `<span class="nm">${st.display}</span>` +
    `<span class="mn mn-${st.maintenance.toLowerCase()}">${UPKEEP[st.maintenance]}</span>`;
  b.onclick = () => pick(id, st.slug);

}
function styleGrid(scr, id, list, note, opt) {
  opt = opt || {};
  if (note) scr.append(el('p', 'gridnote', note));
  if (opt.flat) {
    const g = el('div', 'grid'); list.forEach(st => g.append(tileBtn(id, st))); scr.append(g);
    return;
  }
  // grouped by length so 21 tiles read as five short blocks, not one long wall
  LEN.forEach(len => {
    const inGroup = list.filter(s => s.len === len);
    if (!inGroup.length) return;
    const lbl = D.lengthCategories.find(x => x.value === len).label;
    scr.append(el('div', 'ghdr', lbl));
    const g = el('div', 'grid');
    inGroup.forEach(st => g.append(tileBtn(id, st)));
    scr.append(g);
  });
}

            s.append(warn); return;
          }
          S.photoData = data; startRender(); next('P0b');
        });
      };
      grid.append(b);
    });
    s.append(grid);
    s.append(el('p', 'fine', 'Nothing of you is uploaded on this route.'));
  },

  P1: s => {
    const t = target();
    if (!t) {   // belt and braces - routing should already have skipped this screen
      head(s, 'Nothing to preview yet', 'You sent a photo instead of picking a cut, so there is no style to show.');
      const c = el('button', 'cta', 'Continue'); c.onclick = () => next('P1'); s.append(c); return;
    }
    head(s, "Here's the look");

    const sides = S.S5 ? [lab('S5', S.S5), S.S6 ? lab('S6', S.S6).toLowerCase() : null].filter(Boolean).join(', ') : '—';
    const onwards = txt => { const b = el('button', 'cta', txt || 'Looks right');
                             b.onclick = () => next('P1'); return b; };
    const shapeCard = () => {
      const box = el('div', 'pv');
      box.innerHTML = tileSvg(t, 130) +
        `<div class="t">${t.display}</div><div class="c">your sides: ${sides.toLowerCase()}</div>`;
      return box;
    };
    const noRef = () => el('div', 'warnbox',
      'We have no reference photo for this cut on ' + lab('S0b', S.S0b).toLowerCase() +
      ' hair, so the texture in this one is a rougher guess than usual.');

    // no photo taken at all - the shape card, same as the old prototype
    if (!job) {
      s.append(shapeCard());
      s.append(el('p', 'sub', 'Reference only — this shows the shape, not an exact promise. Your barber will talk it through.'));
      s.append(onwards()); return;
    }

    if (job.state === 'submitting' || job.state === 'running') {
      const w = el('div', 'wait');
      w.innerHTML = '<div class="lbl"><span class="spin"></span><span id="wlbl"></span></div>' +
                    '<div class="track"><i id="wbar"></i></div><div class="note" id="wnote"></div>';
      s.append(w);
      if (job.usedReference === null) s.append(noRef());
      s.append(shapeCard());
      setTimeout(tickWait, 0);
      return;
    }

    if (job.state === 'done') {
      const ba = el('div', 'ba');
      ba.innerHTML =
        `<figure><img src="${S.photoData}" alt="Before"><figcaption>Now</figcaption></figure>` +
        `<figure><img src="${job.outputUrl}" alt="With the new haircut"><figcaption>${t.display}</figcaption></figure>`;
      s.append(ba);
      ba.querySelectorAll('img').forEach(im => { im.onclick = () => zoom(im.src); });
      s.append(el('p', 'sub', 'Tap either picture to see it big.'));
      if (!job.usedReference) s.append(noRef());
      s.append(el('p', 'fine',
        'A preview, not a promise — it shows the shape and length you asked for. ' +
        'Your barber will talk it through.'));
      s.append(onwards());
      const again = el('button', 'cta alt', 'Run it again');
      again.onclick = () => startRender();
      s.append(again);
      return;
    }

    // failed - a preview that does not arrive is not a dead end for the brief
    s.append(el('div', 'warnbox',
      '<b>The preview did not come through.</b><br>' +
      (job.error || 'Something went wrong on our side.') +
      '<br>Your brief is unaffected — the preview is the extra, not the point.'));
    s.append(shapeCard());
    const retry = el('button', 'cta', 'Try again'); retry.onclick = () => startRender();
    s.append(retry);
    s.append(onwards('Carry on without it'));
  },

  S17: s => {
    head(s, 'Your brief', 'Tap anything to change it.');
    const t = target();
    const rows = [];
    const add = (grp, k, id, val) => rows.push({ grp, k, id, val });
    add('The cut', 'Style', route === 'preset' ? 'A1' : (S.S1c ? 'S1c' : 'S1'),
        t ? t.display : 'From your photo');
    if (S.S1 && S.S1c && S.S1 !== S.S1c) add('The cut', 'Right now', 'S1', byId(S.S1).display);
    if (S.photo) add('The cut', 'Your photo', null, 'client-upload.jpg');
    if (S.photoKind) add('The cut', 'Preview', 'P0',
        S.photoKind === 'face' ? 'On your own photo' : 'On a model');
    const UP = { Low: 'Low — wash and go', Medium: 'Some — a bit of product',
                 High: 'High — daily styling', Variable: 'Depends how you wear it' };
    if (t) add('The cut', 'This cut needs', null, UP[t.maintenance]);
    add('The cut', 'You want to spend', 'SE', S.SE ? lab('SE', S.SE).toLowerCase() + ' effort' : null);
    add('Sides', 'Treatment', 'S5', S.S5 ? lab('S5', S.S5) : null);
    if (S.S6) add('Sides', 'Height', 'S6', lab('S6', S.S6));
    if (S.S7) add('Sides', 'Shape', 'S7', lab('S7', S.S7));
    add('Sides', 'Edges', 'S8', S.S8 ? lab('S8', S.S8) : null);
    add('Sides', 'Neckline', 'S9', S.S9 ? lab('S9', S.S9) : null);
    add('Beard', 'Beard', 'S16b', S.S16b && S.S16b !== 'none' ? lab('S16b', S.S16b) : null);
    add('Beard', 'Moustache', 'S16c', S.S16c && S.S16c !== 'none' ? lab('S16c', S.S16c) : null);

    const wrap = el('div', 'sum'); let last = null;
    rows.forEach(r => {
      if (r.grp !== last) { wrap.append(el('div', 'sgrp', r.grp)); last = r.grp; }
      const row = el('div', 'srow');
      row.append(el('dt', '', r.k));
      row.append(el('dd', r.val ? '' : 'empty', r.val || 'not set'));
      if (r.id) {
        const b = el('button', '', r.val ? 'change' : 'add');
        b.onclick = () => { editing = 'S17'; hist.push('S17'); cur = r.id; render(); };
        row.append(b);
      }
      wrap.append(row);
    });
    s.append(wrap);
    const lt = longTransition(), em = effortMismatch();
    if (lt) s.append(el('div', 'flag', `<b>Heads up.</b> ${lt}`));
    if (em) s.append(el('div', 'flag', `<b>Worth a word with your barber.</b> ${em}`));
    const b = el('button', 'cta', 'Looks right — send it'); b.onclick = () => next('S17'); s.append(b);
  },

  S18: s => {
    head(s, 'Nearly done', 'Your barber gets the brief the moment you send it.');
    const f1 = el('div', 'field');
    f1.innerHTML = `<label for="bb">Who's cutting your hair today?</label>
      <select id="bb"><option value="">Choose…</option>
      <option>Jayden</option><option>Maya</option><option>Sem</option><option>Whoever's free</option></select>
      <p class="err">Pick who's cutting your hair so the brief reaches them.</p>`;
    const f2 = el('div', 'field');
    f2.innerHTML = `<label for="em">Your email</label>
      <input id="em" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      <p class="err" id="emerr">Add your email so we can save this brief.</p>`;
    f2.insertAdjacentHTML('afterbegin',
      '<p class="sub" style="margin:0 0 8px">We save your brief against it, so you never explain twice.</p>');
    s.append(f1, f2);
    const b = el('button', 'cta', 'Send my brief');
    s.append(b);
    // button stays live — clicking it tells you what's missing rather than doing nothing
    b.onclick = () => {
      const bb = $('#bb'), em = $('#em');
      const okB = !!bb.value, okE = /\S+@\S+\.\S+/.test(em.value);
      f1.classList.toggle('bad', !okB);
      f2.classList.toggle('bad', !okE);
      $('#emerr').textContent = em.value && !okE
        ? "That doesn't look like an email address — check for a typo."
        : 'Add your email so we can save this brief.';
      if (!okB || !okE) return;
      S.barber = bb.value; S.email = em.value; cur = 'DONE'; hist.push('S18'); render();
    };
    setTimeout(() => {
      $('#bb').onchange = () => f1.classList.remove('bad');
      $('#em').oninput  = () => f2.classList.remove('bad');
    }, 0);
  },

  DONE: s => {
    const t = target();
    s.innerHTML = `<div class="done"><div class="tick">✓</div>
      <h2>Sent to ${S.barber}</h2>
      <p>Your ${t ? t.display.toLowerCase() + ' ' : ''}brief is on their screen. Next time, we'll have it ready before you walk in.</p></div>`;
    const b = el('button', 'cta alt', 'Run it again'); b.onclick = restart; s.append(b);
  },
  FALLBACK: s => head(s, 'Screen ' + cur, 'Not built in this prototype.')
};

function restart() {
  Object.keys(S).forEach(k => delete S[k]);
  route = null; hist = []; skipped = []; editing = null;
  job = null; clearTimeout(waitTimer);
  cur = 'S0'; render();
}

// ── inspector ──
function inspect() {
  const b = $('#ibody'); if (!b) return;
  const t = target();
  const answered = Object.keys(S).filter(k =>
    !['derivedDir','photo','barber','email','photoData','photoKind','avatarId'].includes(k));
  b.innerHTML =
    `<div class="kv"><b>screen</b><span>${cur}</span></div>` +
    `<div class="kv"><b>route</b><span>${route || '—'}</span></div>` +
    `<div class="kv"><b>texture</b><span>${S.S0b || '—'}</span></div>` +
    `<div class="kv"><b>styles offered</b><span>${S.S0b ? availableStyles().length : '—'} / 21</span></div>` +
    `<div class="kv"><b>target style</b><span>${t ? t.slug : '—'}</span></div>` +
    (S.derivedDir ? `<div class="kv"><b>derived dir</b><span>${S.derivedDir}</span></div>` : '') +
    `<div class="kv"><b>answered</b><span>${answered.length}</span></div>` +
    (S.photoKind ? `<div class="kv"><b>image 1</b><span>${S.photoKind}${S.avatarId ? ' / ' + S.avatarId : ''}</span></div>` : '') +
    (job ? `<div class="kv"><b>render</b><span>${job.state}${job.secs ? ' / ' + job.secs + 's' : ''}</span></div>` +
           `<div class="kv"><b>reference</b><span>${job.usedReference === undefined ? '—' : (job.usedReference || 'none - text only')}</span></div>` : '') +
    (t ? `<div class="sec"><div class="kv"><b>image path</b></div><div class="path">brand/style-library/male/${t.id}-${t.slug}/${t.variations[0]}/generated/</div></div>` : '') +
    (skipped.length ? `<div class="sec">` + skipped.map(k =>
        `<div class="sk"><em>${k.id} skipped</em> — ${k.why}</div>`).join('') + `</div>` : '');
}
$('#itog').onclick = () => {
  const p = $('#insp'); p.hidden = !p.hidden;
  $('#itog').classList.toggle('on', !p.hidden);
  $('#sidchip').classList.toggle('show', !p.hidden);
  $('#itog').textContent = p.hidden ? 'Show logic' : 'Hide logic';
  if (!p.hidden) inspect();
};
$('#lbx').onclick = () => { $('#lb').className = ''; };
$('#lb').onclick = e => { if (e.target.id !== 'lbi') $('#lb').className = ''; };
$('#back').onclick = back;
$('#rst').onclick = restart;
restart();

</script>
</body>
</html>
